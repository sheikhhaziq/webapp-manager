app-id: io.github.sheikhhaziq.WebappManager

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

build-options:
  append-path: /usr/lib/sdk/node24/bin

command: webapp-manager

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-data/applications
  - --filesystem=xdg-data/webapps:create
  - --talk-name=org.freedesktop.Flatpak
  - --device=dri

modules:
  - name: webapp-manager
    buildsystem: simple

    build-commands:
      - meson setup _build --prefix=/app
      - meson compile -C _build
      - meson install -C _build

    sources:
      - type: dir
        path: ../..